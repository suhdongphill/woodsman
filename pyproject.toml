[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pms"
version = "0.1.0"
description = "로컬 SQLite 기반 포트폴리오/시세 관리 CLI"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "pandas>=1.5",
]

[project.scripts]
pms = "pms.cli:cli"

[tool.setuptools]
packages = ["pms"]
