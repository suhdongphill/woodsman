# 금리·거시(rates) 섹션이 수집하는 계열 — **계열 ID의 단일 출처.**
#
# ⚠ 코드 어디에도 계열 ID를 하드코딩하지 않는다(명세 §0-4). 여기가 유일한 목록이고,
#    `pms rates verify`가 각 ID의 존재·최신 관측일·단위를 실제 API로 확인한다.
# ⚠ `definition_ko`는 `docs/금리섹션_지표해설.md`와 **같은 문장**을 쓴다. 세 곳에서 갈라지면
#    화면 툴팁·DB·문서가 서로 다른 말을 하게 된다(명세 §9).
# ⚠ `unit_verified: false`는 "관측치는 받아 봤지만 단위를 메타데이터로 확인하지 못했다"는 뜻이다.
#    FRED 메타데이터 API에는 키가 필요하다 — `FRED_API_KEY`를 넣고 verify를 다시 돌리면 채워진다.
#
# 확인 이력: 2026-09-05 — FRED 34개 전부 관측치 응답 확인, ECOS 4개 항목코드 확인.
#   ⚠ 명세가 후보로 적은 ECOS `721Y001`(시장금리 일별)은 **틀렸다.** 그 표에는 일별 주기가
#     없다(A/M/Q뿐). 일별 시장금리는 `817Y002`다.

meta:
  verified_at: "2026-09-05"
  note: "관측치 응답으로 확인. 단위·계절조정은 FRED_API_KEY 등록 후 verify가 채운다."

fred:
