# 금리 섹션의 판단 상수 — ⚠ 코드에 숫자를 박지 않는다.
#
# 여기 있는 값은 전부 **출처와 기준일**을 함께 적는다. 출처를 못 대는 상수는 넣지 않는다.

# 중립금리 r*. ⚠ **하드코딩 금지**(명세 §4-7). 비워 두면 「정책 제약도」 레이어를 NULL로 두고
#   나머지 가중치를 재정규화한 뒤 화면에 「부분 산출」 배지를 붙인다.
neutral_rate:
  value: null
  source: null      # 예: "FOMC 경제전망요약(SEP) 장기 연방기금금리 중앙값"
  as_of: null       # 예: "2026-06-18"
  note: "값을 채우기 전까지 정책 제약도 레이어는 산출하지 않는다."

# 참가율 조정 실업률의 기준월. ⚠ 기준을 바꾸면 값이 크게 달라지므로 화면에 반드시 표기한다.
participation_base:
  month: "2026-01"
  note: "당해 1월 참가율로 고정. 명세 §4-4의 기본값."

# 백분위를 재는 기간(년). labor_cooling·OAS 백분위에 쓴다.
percentile_years: 10

# 인플레이션 목표. 화면의 점선 라벨과 easing_pressure_index의 거리 계산에 함께 쓴다.
inflation_target: 2.0
