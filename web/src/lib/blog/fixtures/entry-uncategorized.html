<meta name="description" content="커버드콜 ETF의 고배당(분배율)의 정체와 예측이 어려운 시장에서 현금흐름을 관리하는 방법초보 투자자들은 ETF를 주식과 같이 생각하고, 매월, 매주는 분배하는 것을 배당으로 이해할 수 있어서 주의가 필요합니다. 분배되 는 현금은 해당 ETF에서 포트폴리오의 자산을 처분해서 배분해 준다는 것을 알아야 합니다. 해당 자산이 크게 오르지 않는다면 옵션의 프레미엄으로 배분금을 충단하지 못하면 NAV가 줄 수 밖에 없는 것입니다. 연 12% 분배율이면 그렇게 됩니다. 1억 원을 넣으면 매달 100만 원이 들어옵니다. 은퇴를 앞두고 있거나 이미 은퇴한 분에게 이 숫자는 강력합니다. 생활비가 통장에 꽂히는 감각은 총수익률 몇 퍼센트라는 말보다 훨씬 구체적이니까요. 배당주나 일반 배당 ETF가 연 5~6%인.."/>
