name: 예약 수집 (워커 밖)

# 워커에서 막히거나 워커가 돌릴 수 없는 수집을 여기서 돈다.
#
# ⚠ 왜 워커가 아닌가
#  - 재무부(S2-c): 워커 → treasury.gov가 525·시간 초과로 계속 막혔다(로컬은 성공). 2026-09-13부터
#    매 수집마다 네 계열이 전부 실패했다. 원인 미확정 — 워커에서 다시 열리면 그쪽으로 되돌린다.
#  - 금리 허브(rates.json): FRED·ECOS를 받아 pandas로 계산해 **정적 파일**로 내보내는 파이썬
#    파이프라인이다. 워커에 파이썬이 없다. 2026-09-07 이후 아무도 안 돌려 9일이 묵어 있었다.
#
# ⚠ 두 작업은 서로 독립이다. 하나가 실패해도 다른 하나는 돈다(`needs`로 묶지 않는다).

on:
  schedule:
    # ⚠ cron은 UTC다. 평일만 — 재무부·FRED 발표가 없는 주말에 실패 알림을 만들지 않는다.
    # 20:00 UTC = 05:00 KST — 금리 허브. 배포까지 끝나야 하므로 재무부보다 먼저.
    - cron: "0 20 * * MON-FRI"
    # 20:30 UTC = 05:30 KST — 재무부. ⭐ 워커의 06:00 KST 전체 수집 **직전**이라,
    # 그 수집 뒤 점수 계산에 재무부 값이 들어간다.
    - cron: "30 20 * * MON-FRI"
  workflow_dispatch:
    inputs:
      job:
        description: 손으로 돌릴 작업
        type: choice
        options: [both, treasury, rates]
        default: both

concurrency:
  # 같은 작업이 겹쳐 돌면 D1에 같은 행을 두 번 쓴다. 앞의 것을 기다리지 않고 **건너뛴다**.
  group: scheduled-data
  cancel-in-progress: false

jobs:
  treasury:
    name: 재무부 → D1
    runs-on: ubuntu-latest
    # 20:00 스케줄에는 돌지 않는다(그때는 금리 허브만).
    if: >-
      github.event.schedule == '30 20 * * MON-FRI' ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["both","treasury"]'), inputs.job))
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # ⚠ 스크립트가 종료 코드 1을 내면(계열 하나라도 실패) 이 단계가 빨갛게 죽는다 — 그래야 알림이 온다.
      #    실패해도 MacroIngest 줄은 이미 쓰였으므로 관리자 화면에서 사유를 볼 수 있다.
      - name: 재무부 네 계열 수집
        run: node --import tsx scripts/treasury-daily.mjs --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  rates:
    name: 금리 허브 rates.json
    runs-on: ubuntu-latest
    if: >-
      github.event.schedule == '0 20 * * MON-FRI' ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["both","rates"]'), inputs.job))
    permissions:
      contents: write
      # ⚠ 아래 「배포 부르기」에 필요하다. GITHUB_TOKEN으로 push한 커밋은 GitHub가 워크플로를
      #    **자동으로 태우지 않는다**(무한 루프 방지). 그래서 배포를 명시적으로 부른다.
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e .

      # pms.db는 gitignore다(13MB SQLite). 캐시가 없으면 파이프라인이 전 기간을 다시 받는다 —
      # 느릴 뿐 틀리지는 않는다. 캐시는 빠르게 하려는 것이지 정확성의 조건이 아니다.
      - name: 누적 DB 캐시
        uses: actions/cache@v4
        with:
          path: pms.db
          key: pms-db-${{ github.run_id }}
          restore-keys: pms-db-

      # ⚠ 실패하면 이전 rates.json을 그대로 두고 meta.stale을 켠다(파이프라인이 그렇게 만들어져 있다) —
      #    오래된 데이터를 최신인 것처럼 보여주지 않는다. 그 경우에도 아래 커밋 단계가 stale 표시를 올린다.
      - name: fetch → compute → export
        run: pms rates daily
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}

      - name: rates.json 커밋
        id: commit
        run: |
          if git diff --quiet -- web/public/data/rates.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "rates.json이 그대로다 — 커밋하지 않는다(빈 커밋으로 배포를 부르지 않는다)."
            exit 0
          fi
          git config user.name "woodsman-bot"
          git config user.email "suhdp71@gmail.com"
          git add web/public/data/rates.json
          git commit -m "자료: 금리 허브 rates.json 갱신 (예약 수집)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # rates.json은 **정적 자산**이라 배포되어야 화면에 닿는다. 위 push는 워크플로를 태우지 않으므로
      # 여기서 배포를 직접 부른다. ⚠ 안 부르면 저장소에는 새 값이, 화면에는 옛 값이 남는다.
      - name: 배포 부르기
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
