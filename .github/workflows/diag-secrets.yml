# ⚠ 일회용 진단 워크플로. 원인을 찾으면 삭제한다.
#
# 배포가 D1 마이그레이션에서 7403으로 죽는데, 같은 토큰·같은 계정·같은 엔드포인트가
# 개발자 PC에서는 성공한다. 시크릿 값은 넣은 뒤 다시 읽을 수 없어서 추측이 반복됐다.
# 그래서 러너에게 직접 묻는다 — 값은 찍지 않고 지문(sha256 앞 8자리)만 찍는다.
name: diag-secrets

on:
  workflow_dispatch:

jobs:
  diag:
    name: 시크릿 지문과 API 실호출
    runs-on: ubuntu-latest
    steps:
      - name: 지문 대조 + Cloudflare 직접 호출
        env:
          TOK: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DB: e0ef7847-236c-48bb-945e-e0f95fe0cbeb
        run: |
          echo "== 시크릿 지문 =="
          echo "토큰 길이: ${#TOK}  지문: $(printf '%s' "$TOK" | sha256sum | cut -c1-8)"
          echo "계정 길이: ${#ACC}  지문: $(printf '%s' "$ACC" | sha256sum | cut -c1-8)"
          echo "토큰 접두사가 cfat_ 인가: $(case "$TOK" in cfat_*) echo yes;; *) echo no;; esac)"

          echo
          echo "== 1) 토큰 유효성 (user 범위) =="
          curl -s -w '\nHTTP %{http_code}\n' \
            -H "Authorization: Bearer $TOK" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify"

          echo
          echo "== 2) 토큰 유효성 (account 범위) =="
          curl -s -w '\nHTTP %{http_code}\n' \
            -H "Authorization: Bearer $TOK" \
            "https://api.cloudflare.com/client/v4/accounts/$ACC/tokens/verify"

          echo
          echo "== 3) D1 목록 (읽기 권한) =="
          curl -s -w '\nHTTP %{http_code}\n' \
            -H "Authorization: Bearer $TOK" \
            "https://api.cloudflare.com/client/v4/accounts/$ACC/d1/database"

          echo
          echo "== 4) D1 query — 쓰기 권한 =="
          curl -s -w '\nHTTP %{http_code}\n' -X POST \
            -H "Authorization: Bearer $TOK" \
            -H "Content-Type: application/json" \
            -d '{"sql":"SELECT 1"}' \
            "https://api.cloudflare.com/client/v4/accounts/$ACC/d1/database/$DB/query"

          # 배포에 필요한 나머지 권한을 한 번에 잰다. 읽기 엔드포인트만 쓴다 —
          # 무엇이 없는지 아는 데 쓰기를 시도할 이유가 없다.
          echo
          echo "== 배포에 필요한 권한 점검 (HTTP 200이면 있음) =="
          probe() {
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOK" "$2")
            if [ "$code" = "200" ]; then mark="있음"; else mark="없음"; fi
            printf '%-34s HTTP %s  %s\n' "$1" "$code" "$mark"
          }
          probe "Workers Scripts"      "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts"
          probe "Account Settings"     "https://api.cloudflare.com/client/v4/accounts/$ACC"
          probe "Workers KV"           "https://api.cloudflare.com/client/v4/accounts/$ACC/storage/kv/namespaces"
          probe "Workers R2"           "https://api.cloudflare.com/client/v4/accounts/$ACC/r2/buckets"
          probe "Zone (Workers Routes)" "https://api.cloudflare.com/client/v4/zones?name=portfolio-solutions.net"
