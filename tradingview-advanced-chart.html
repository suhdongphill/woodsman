<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SK하이닉스 (KRX:000660) · TradingView Advanced Chart</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b1220; font-family: sans-serif; }
    #tv_chart { height: 100vh; width: 100vw; }
    #fallback { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
                color: #8b9dc3; font-size: 14px; text-align: center; padding: 24px; }
  </style>
  <!-- TradingView Advanced Real-Time Chart Widget -->
  <script src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>
  <div id="tv_chart"></div>
  <div id="fallback">TradingView 위젯을 불러오지 못했습니다.<br/>네트워크 연결을 확인하세요.</div>
  <script>
    if (window.TradingView) {
      new TradingView.widget({
        container_id: "tv_chart",
        autosize: true,
        symbol: "KRX:000660",          // SK하이닉스
        interval: "D",                  // 일봉
        timezone: "Asia/Seoul",
        theme: "dark",                  // 다크테마
        style: "1",                     // 캔들
        locale: "kr",
        toolbar_bg: "#0b1220",
        enable_publishing: false,
        allow_symbol_change: true,
        hide_side_toolbar: false,
        withdateranges: true,
        // 20/60/120 단순이동평균선 + RSI(14)
        studies: [
          { id: "MASimple@tv-basicstudies", inputs: { length: 20 } },
          { id: "MASimple@tv-basicstudies", inputs: { length: 60 } },
          { id: "MASimple@tv-basicstudies", inputs: { length: 120 } },
          { id: "RSI@tv-basicstudies",      inputs: { length: 14 } }
        ]
      });
    } else {
      document.getElementById("fallback").style.display = "flex";
    }
  </script>
</body>
</html>
