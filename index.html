  <script>
    /* Babel 8부터 preset-react가 자동(automatic) JSX 런타임을 기본값으로 사용해
       `import { jsx } from "react/jsx-runtime"`를 내보낸다. 이 페이지는 React를
       전역 UMD(React.createElement)로 로드하므로 그 import가 깨져 화면이 백지가 된다.
       → 항상 classic 런타임을 쓰도록 커스텀 프리셋을 등록한다. (data-presets="react-classic") */

      presets: [[Babel.availablePresets.react, { runtime: 'classic' }]],
    });

    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Noto Sans KR',sans-serif;background:#0f1117;color:#e5e7eb}

    .slide-in{animation:slideIn .3s ease-out}@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}

    @keyframes toastIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    @keyframes toastOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(16px)}}

    /* ═══ Auth (client-side, localStorage) ═══ */
    function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
    async function sha256Hex(text){
      if(window.crypto&&crypto.subtle){try{const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');}catch{}}
      // 비보안 컨텍스트(file://)용 폴백 해시 — 동일 함수로 검증하므로 일관됨
      let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<text.length;i++){const ch=text.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(h2>>>0).toString(16).padStart(8,'0')+(h1>>>0).toString(16).padStart(8,'0');
    }
    async function hashPassword(pw,salt){return await sha256Hex(salt+'::'+pw);}
    function loadUsers(){try{return JSON.parse(localStorage.getItem(USERS_KEY))||[];}catch{return[];}}

    async function ensureSeedAdmin(){const users=loadUsers();if(users.length===0){const salt=genId();const pwHash=await hashPassword('admin1234',salt);const adminId=genId();saveUsers([{id:adminId,username:'admin',salt,pwHash,role:'admin',createdAt:new Date().toISOString()}]);
      // 기존 단일 포트폴리오(stocklens_portfolio)를 최초 관리자 계정으로 이관 (원본 키는 백업으로 보존)

    function formatCompact(n,c){if(c==='KRW'){if(n>=1e8)return(n/1e8).toFixed(1)+'억';if(n>=1e4)return(n/1e4).toFixed(0)+'만';return n.toLocaleString('ko-KR')+'원';}if(n>=1e6)return'$'+(n/1e6).toFixed(1)+'M';if(n>=1e3)return'$'+(n/1e3).toFixed(1)+'K';return'$'+n.toFixed(2);}

    /* ═══ Markdown ═══ */
    function renderMarkdown(text){if(!text)return null;const lines=text.split('\n');const el=[];let k=0;for(const line of lines){const t=line.trim();if(!t){el.push(<br key={k++}/>);continue;}if(/^###\s/.test(t))el.push(<h4 key={k++} className="text-sm font-semibold text-white mt-4 mb-2">{pi(t.slice(4))}</h4>);else if(/^##\s/.test(t))el.push(<h3 key={k++} className="text-base font-semibold text-white mt-4 mb-2">{pi(t.slice(3))}</h3>);else if(/^#\s/.test(t))el.push(<h3 key={k++} className="text-base font-bold text-white mt-4 mb-2">{pi(t.slice(2))}</h3>);else if(/^[-*]\s/.test(t))el.push(<div key={k++} className="flex gap-2 mb-1.5"><span className="text-emerald-400 mt-1 shrink-0">•</span><span className="text-sm text-gray-300 leading-relaxed">{pi(t.slice(2))}</span></div>);else if(/^\d+\.\s/.test(t)){const n=t.match(/^(\d+)\.\s/)[1];el.push(<div key={k++} className="flex gap-2 mb-1.5"><span className="text-emerald-400 mt-0.5 shrink-0 text-sm font-medium w-5 text-right">{n}.</span><span className="text-sm text-gray-300 leading-relaxed">{pi(t.replace(/^\d+\.\s/,''))}</span></div>);}else el.push(<p key={k++} className="text-sm text-gray-300 leading-relaxed mb-1.5">{pi(t)}</p>);}return el;}
    function pi(text){const parts=[];const re=/\*\*(.+?)\*\*/g;let last=0,m;while((m=re.exec(text))!==null){if(m.index>last)parts.push(text.slice(last,m.index));parts.push(<strong key={m.index} className="text-white font-semibold">{m[1]}</strong>);last=re.lastIndex;}if(last<text.length)parts.push(text.slice(last));return parts.length>0?parts:text;}

    /* ═══ CORS 프록시 공용 페치 (여러 프록시 폴백) ═══ */
    async function proxiedFetchJson(targetUrl) {
      let lastErr = null;
      for (const build of PROXY_BUILDERS) {
        const { url, wrapped } = build(targetUrl);
        const tag = url.replace(/^https?:\/\//,'').slice(0,28);
        try {
          const res = await fetch(url);
          if (!res.ok) { console.warn(`[Woodsman] proxy ${tag} → HTTP ${res.status}`); lastErr = new Error(`HTTP ${res.status}`); continue; }
          if (wrapped) { const w = await res.json(); if (w?.contents == null) { lastErr = new Error('empty wrapped'); continue; } return JSON.parse(w.contents); }
          return await res.json();
        } catch (e) { console.warn(`[Woodsman] proxy ${tag} → ${e.message}`); lastErr = e; continue; }
      }
      throw lastErr || new Error('모든 프록시 실패');
    }

    /* ═══ Yahoo Finance API (with proxy+host fallback) ═══ */
    async function fetchYahoo(ticker, params = '') {
      for (const host of YAHOO_HOSTS) {
        const yahooUrl = `https://${host}.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(ticker)}${params}`;
        try { const json = await proxiedFetchJson(yahooUrl); if (json?.chart?.result?.[0]) return json; }
        catch (e) { console.warn(`[Woodsman] yahoo-chart ${host} → ${e.message}`); }
      }
      console.error(`[Woodsman] 모든 프록시/호스트 조합 실패 — ticker: ${ticker}, params: ${params}`);
      throw new Error('모든 데이터 소스에서 조회 실패');
    }

    async function fetchCurrentPrice(ticker) {
      const json = await fetchYahoo(ticker);
      const meta = json?.chart?.result?.[0]?.meta;
      if (!meta?.regularMarketPrice) throw new Error('가격 데이터 없음');
      return { price: meta.regularMarketPrice, exchange: meta.exchangeName || '', currency: meta.currency || '' };
    }

    async function fetchChartData(ticker) {
      const ck = `chart_v2_${ticker}`; // v2: OHLCV + 1년 범위 (MA120/캔들용)
      try { const c = sessionStorage.getItem(ck); if (c) { const p = JSON.parse(c); if (Date.now() - p._cachedAt < CHART_CACHE_TTL) return p; } } catch {}
      const json = await fetchYahoo(ticker, '?range=1y&interval=1d');
      const result = json?.chart?.result?.[0];
      if (!result) throw new Error('차트 데이터 없음');
      const timestamps = result?.timestamp ?? [];
      const q = result?.indicators?.quote?.[0] ?? {};
      const pad = n => String(n).padStart(2, '0');
      const data = {
        times: timestamps.map(t => { const d = new Date(t * 1000); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }),
        opens: (q.open ?? []).map(x => x != null ? x : null),
        highs: (q.high ?? []).map(x => x != null ? x : null),
        lows: (q.low ?? []).map(x => x != null ? x : null),
        closes: (q.close ?? []).map(x => x != null ? x : null),
        volumes: (q.volume ?? []).map(x => x != null ? x : 0),
        exchange: result.meta?.exchangeName || '',
        currency: result.meta?.currency || '',
        _cachedAt: Date.now(),

      try { sessionStorage.setItem(ck, JSON.stringify(data)); } catch {}

    /* ═══ Symbol Search (이름/코드 → 종목코드 자동 조회) ═══ */
    /* 영문명·티커는 Yahoo Finance, 한글명·6자리 종목코드는 네이버 금융 자동완성을 사용한다. */
    const _symbolSearchCache = new Map();
    const _hasHangul = (s) => /[가-힣㄰-㆏]/.test(s);

    async function searchSymbolsYahoo(q) {
      for (const host of YAHOO_HOSTS) {
        try {
          const yahooUrl = `https://${host}.finance.yahoo.com/v1/finance/search?q=${encodeURIComponent(q)}&quotesCount=10&newsCount=0&lang=ko-KR&region=KR`;
          const json = await proxiedFetchJson(yahooUrl);
          const quotes = json?.quotes;
          if (Array.isArray(quotes)) {
            return quotes
              .filter(x => x.symbol && (!x.quoteType || ['EQUITY','ETF'].includes(x.quoteType)))
              .map(x => ({
                symbol: x.symbol,
                name: x.longname || x.shortname || x.symbol,
                exchange: x.exchDisp || x.exchange || '',
                type: x.typeDisp || x.quoteType || '',
                currency: /\.(KS|KQ)$/i.test(x.symbol) ? 'KRW' : 'USD',
              }));
          }
        } catch (e) { console.warn(`[Woodsman] yahoo-search ${host} → ${e.message}`); }
      }
      throw new Error('Yahoo 검색 실패');
    }

    async function searchSymbolsNaver(q) {
      const naverUrl = `https://m.stock.naver.com/front-api/search/autoComplete?query=${encodeURIComponent(q)}&target=stock`;
      {
        try {
          const json = await proxiedFetchJson(naverUrl);
          const items = json?.result?.items;
          if (Array.isArray(items)) {
            return items
              .filter(it => it.category === 'stock' && it.code)
              .map(it => {
                const isKr = it.nationCode === 'KOR';
                const isKosdaq = it.typeCode === 'KOSDAQ' || it.typeName === '코스닥';
                return {
                  symbol: isKr ? `${it.code}${isKosdaq ? '.KQ' : '.KS'}` : it.code,
                  name: it.name,
                  exchange: it.typeName || it.nationName || '',
                  type: '주식',
                  currency: isKr ? 'KRW' : 'USD',
                };
              });
          }
        } catch (e) { console.warn(`[Woodsman] naver-search → ${e.message}`); }
      }
      throw new Error('네이버 검색 실패');
    }

    async function searchSymbols(query) {
      const q = query.trim();
      if (!q) return [];
      const key = q.toLowerCase();
      if (_symbolSearchCache.has(key)) return _symbolSearchCache.get(key);
      // 한글명이나 6자리 종목코드는 네이버를, 그 외(영문명·티커)는 Yahoo를 우선 사용하고 서로 폴백한다.
      const korFirst = _hasHangul(q) || /^\d{6}$/.test(q);
      const sources = korFirst ? [searchSymbolsNaver, searchSymbolsYahoo] : [searchSymbolsYahoo, searchSymbolsNaver];
      let threw = 0, lastErr = null;
      for (const src of sources) {
        try { const r = await src(q); if (r && r.length) { _symbolSearchCache.set(key, r); return r; } }
        catch (e) { threw++; lastErr = e; }
      }
      if (threw === sources.length) throw lastErr || new Error('모든 데이터 소스에서 검색 실패');
      _symbolSearchCache.set(key, []); // 정상 응답이지만 일치하는 종목 없음
      return [];
    }

    /* 종목 코드(접미사)·통화로 상장 국가를 추정해 국기 이모지를 돌려준다. */
    function countryFlag(r){
      const sym=(r.symbol||'').toUpperCase();
      const suf=(sym.match(/\.([A-Z]+)$/)||[])[1]||'';
      const F={KS:'🇰🇷',KQ:'🇰🇷',T:'🇯🇵',HK:'🇭🇰',SS:'🇨🇳',SZ:'🇨🇳',L:'🇬🇧',DE:'🇩🇪',F:'🇩🇪',PA:'🇫🇷',AS:'🇳🇱',MI:'🇮🇹',MC:'🇪🇸',TO:'🇨🇦',V:'🇨🇦',AX:'🇦🇺',NZ:'🇳🇿',SI:'🇸🇬',TW:'🇹🇼',TWO:'🇹🇼',KL:'🇲🇾',BK:'🇹🇭',JK:'🇮🇩',BO:'🇮🇳',NS:'🇮🇳',SA:'🇧🇷',MX:'🇲🇽',ST:'🇸🇪',HE:'🇫🇮',OL:'🇳🇴',CO:'🇩🇰',SW:'🇨🇭',VI:'🇦🇹',IS:'🇹🇷',TA:'🇮🇱',JO:'🇿🇦'};
      if(F[suf])return F[suf];
      if(!suf)return r.currency==='KRW'?'🇰🇷':'🇺🇸'; // 접미사 없으면 미국(또는 KRW면 한국)
      return '🏳️';
    }

    /* ═══ Claude API ═══ */
    async function callClaude(apiKey,system,userMsg){
      let lastErr=null;
      for(const model of CLAUDE_MODELS){
        let res;
        try{
          res=await fetch(CLAUDE_API,{method:'POST',headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model,max_tokens:2048,system,messages:[{role:'user',content:userMsg}]})});
        }catch(e){lastErr=e;console.warn(`[Woodsman] 모델 ${model} 요청 실패(네트워크) → 다음 모델 시도: ${e.message}`);continue;}
        if(res.ok){const json=await res.json();return json.content?.[0]?.text||'';}
        const err=await res.json().catch(()=>({}));
        const msg=err?.error?.message||`API Error ${res.status}`;
        // 인증 오류(401)·요청 한도 초과(429)는 모델을 바꿔도 동일하게 실패하므로 즉시 중단한다.
        if(res.status===401||res.status===429){throw new Error(msg);}
        // 그 외(404 폐기/오타 모델, 403 권한 없음, 400, 5xx 등)는 다른 모델로 폴백한다.
        lastErr=new Error(msg);
        console.warn(`[Woodsman] 모델 ${model} 사용 불가(HTTP ${res.status}) → 다음 모델 시도: ${msg}`);
      }
      throw lastErr||new Error('사용 가능한 Claude 모델이 없습니다');
    }
    async function fetchCanslim(apiKey,ticker,name,retry=0){const ck=`canslim_${ticker}`;try{const c=localStorage.getItem(ck);if(c){const p=JSON.parse(c);if(Date.now()-p._cachedAt<CANSLIM_CACHE_TTL)return p.data;}}catch{}const sys=`당신은 CANSLIM 투자 방법론 전문가입니다. 주어진 종목을 분석하여 반드시 아래 JSON 형식으로만 응답하세요. 다른 텍스트는 포함하지 마세요.`;const usr=`종목명: ${name}, 티커: ${ticker}\n이 종목을 CANSLIM 방법론으로 분석하여 각 항목을 0~10점으로 평가하세요.\n{"C":{"score":숫자,"reason":"한 줄 근거"},"A":{"score":숫자,"reason":"한 줄 근거"},"N":{"score":숫자,"reason":"한 줄 근거"},"S":{"score":숫자,"reason":"한 줄 근거"},"L":{"score":숫자,"reason":"한 줄 근거"},"I":{"score":숫자,"reason":"한 줄 근거"},"M":{"score":숫자,"reason":"한 줄 근거"},"composite":숫자}`;const raw=await callClaude(apiKey,sys,usr);try{const js=raw.replace(/```json?\s*/g,'').replace(/```/g,'').trim();const data=JSON.parse(js);for(const k of['C','A','N','S','L','I','M'])if(typeof data[k]?.score!=='number')throw 0;if(typeof data.composite!=='number')data.composite=parseFloat((['C','A','N','S','L','I','M'].reduce((s,k)=>s+data[k].score,0)/7).toFixed(1));try{localStorage.setItem(ck,JSON.stringify({data,_cachedAt:Date.now()}));}catch{}return data;}catch{if(retry<1)return fetchCanslim(apiKey,ticker,name,retry+1);throw new Error('분석 결과 파싱 실패');}}
    /* ═══ 주요 기사(뉴스) 조회 — Yahoo Finance 검색 뉴스(실데이터: 제목·출처·링크·게재시각) ═══ */

    /* ═══ Toast System ═══ */

    function ToastContainer({ toasts, removeToast }) {

        </div>

    function useToast() {
      const [toasts, setToasts] = useState([]);
      const addToast = useCallback((message, type='success') => {
        const id = ++_toastId;
        setToasts(prev => [...prev, { id, message, type, leaving: false }]);
        setTimeout(() => setToasts(prev => prev.map(t => t.id === id ? { ...t, leaving: true } : t)), 2700);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
      }, []);
      const removeToast = useCallback(id => setToasts(prev => prev.filter(t => t.id !== id)), []);
      return { toasts, addToast, removeToast };
    }

      const handleFile = (e) => {
        const file = e.target.files?.[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            if (!Array.isArray(data)) throw new Error('배열 형식이 아닙니다');
            const valid = data.filter(validateHolding);
            if (valid.length === 0) throw new Error('유효한 종목 데이터가 없습니다');
            setFileData({ all: data, valid }); setError(null);
          } catch (err) { setError(err.message); setFileData(null); }
        };

      const handleConfirm = () => { if (!fileData) return; onImport(fileData.valid, mode); onClose(); };

    function IndustryDoughnut({holdings,prices}){const ref=useRef(null);const c=useRef(null);const{iData,cnt}=useMemo(()=>{const m={};holdings.forEach(h=>{const p=prices[h.ticker]?.price??h.avgCost;m[h.industry]=(m[h.industry]||0)+p*h.shares;});return{iData:Object.entries(m).sort((a,b)=>b[1]-a[1]),cnt:holdings.length};},[holdings,prices]);useEffect(()=>{if(!ref.current||!iData.length)return;if(c.current)c.current.destroy();const labels=iData.map(([k])=>k);const vals=iData.map(([,v])=>v);const total=vals.reduce((s,v)=>s+v,0);const cols=labels.map(l=>INDUSTRY_COLORS[INDUSTRIES.indexOf(l)]||'#6b7280');c.current=new Chart(ref.current,{type:'doughnut',data:{labels,datasets:[{data:vals,backgroundColor:cols,borderColor:'#1a1d27',borderWidth:3,hoverBorderColor:'#2a2e3a'}]},options:{responsive:true,maintainAspectRatio:false,cutout:'68%',plugins:{legend:{display:false},tooltip:{backgroundColor:'#1a1d27',borderColor:'#2a2e3a',borderWidth:1,titleColor:'#9ca3af',bodyColor:'#fff',padding:10,displayColors:true,callbacks:{label:ctx=>`${ctx.label}: ${(ctx.raw/total*100).toFixed(1)}%`}}}}});return()=>{if(c.current)c.current.destroy();};},[iData]);if(!iData.length)return null;const total=iData.reduce((s,[,v])=>s+v,0);return(<div className="bg-card border border-border rounded-xl p-5"><h3 className="text-sm font-semibold text-white mb-4">산업별 비중</h3><div className="flex gap-6 items-center"><div className="relative shrink-0" style={{width:'160px',height:'160px'}}><canvas ref={ref}/><div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none"><p className="text-2xl font-bold text-white">{cnt}</p><p className="text-[10px] text-gray-500">종목</p></div></div><div className="flex-1 space-y-2 min-w-0">{iData.map(([ind,val])=>{const pct=(val/total*100).toFixed(1);const color=INDUSTRY_COLORS[INDUSTRIES.indexOf(ind)]||'#6b7280';return<div key={ind} className="flex items-center gap-2"><div className="w-2.5 h-2.5 rounded-full shrink-0" style={{backgroundColor:color}     /* ═══ Summary Panel ═══ */
    function SummaryPanel({holdings,prices}){const stats=useMemo(()=>{let kc=0,kv=0,uc=0,uv=0;const cs=[];holdings.forEach(h=>{const cost=h.avgCost*h.shares;const p=prices[h.ticker]?.price??h.avgCost;const val=p*h.shares;if(h.currency==='KRW'){kc+=cost;kv+=val;}else{uc+=cost;uv+=val;}const s=getCachedCanslim(h.ticker);if(s)cs.push(s.composite);});return{kc,kv,uc,uv,avgC:cs.length?parseFloat((cs.reduce((a,b)=>a+b,0)/cs.length).toFixed(1)):null,cCnt:cs.length};},[holdings,prices]);const kp=stats.kc>0?((stats.kv-stats.kc)/stats.kc*100):null;const up=stats.uc>0?((stats.uv-stats.uc)/stats.uc*100):null;

    </div><IndustryDoughnut holdings={holdings} prices={prices}/></div>);}

    /* ═══ CANSLIM / Trends Sections ═══ */
    function CanslimSection({ticker,name,onNeedApiKey}){const[data,setData]=useState(null);const[loading,setLoading]=useState(false);const[error,setError]=useState(null);const run=useCallback(async()=>{const ak=getApiKey();if(!ak){onNeedApiKey();return;}setLoading(true);setError(null);try{setData(await fetchCanslim(ak,ticker,name));}catch(e){setError(e.message);}finally{setLoading(false);}},[ticker,name,onNeedApiKey]);useEffect(()=>{const c=getCachedCanslim(ticker);if(c)setData(c);},[ticker]);const keys=['C','A','N','S','L','I','M'];const sc=data?scoreColor(data.composite):null;
    return(<div className="bg-card border border-border rounded-xl p-5"><div className="flex items-center justify-between mb-4"><h3 className="text-sm font-semibold text-white flex items-center gap-2"><BrainIcon/> CANSLIM 분석</h3><button onClick={run} disabled={loading} className="flex items-center gap-1.5 px-3 py-1.5 text-xs bg-purple-600/20 hover:bg-purple-600/30 border border-purple-500/30 text-purple-400 rounded-lg transition-colors disabled:opacity-50">{loading?<Spinner size={12}/>:<BrainIcon/>}{loading?'분석 중...':data?'재분석':'분석 시작'}</button></div>{loading&&!data&&<div className="flex flex-col items-center justify-center py-12 gap-3"><div className="pulse-glow text-purple-400 flex items-center gap-2"><Spinner size={20}/><span className="text-sm">AI 분석 중...</span></div></div>}{error&&<div className="flex flex-col items-center justify-center py-8 gap-3"><p className="text-sm text-red-400">{error}</p><button onClick={run} className="flex items-center gap-1.5 px-3 py-1.5 text-xs bg-gray-700 hover:bg-gray-600 rounded-lg text-gray-300 transition-colors"><RefreshIcon/> 다시 시도</button></div>}{data&&<div className="space-y-5"><div className="grid grid-cols-1 md:grid-cols-2 gap-5"><div className="flex flex-col items-center justify-center py-4"><div className={`w-24 h-24 rounded-full flex items-center justify-center ring-4 ${sc.ring} bg-[#12141c]`}><div className="text-center"><p className={`text-3xl font-bold ${sc.text}`}>{data.composite}</p><p className="text-[10px] text-gray-500 -mt-0.5">/ 10</p></div></div><p className="text-xs text-gray-500 mt-3">종합 CANSLIM 점수</p><p className={`text-sm font-medium mt-1 ${sc.text}`}>{data.composite>=7?'우수':data.composite>=5?'보통':'주의'}</p></div><div style={{height:'220px'}}><CanslimRadar data={data}/></div></div><div className="space-y-2">{keys.map(k=>{const item=data[k];const isc=scoreColor(item.score);return<div key={k} className="flex items-center gap-3"><div className="w-7 shrink-0"><span className={`text-sm font-bold ${isc.text}`}>{k}</span></div><div className="flex-1"><div className="flex items-center gap-2 mb-1"><div className="flex-1 h-2 bg-[#12141c] rounded-full overflow-hidden"><div className={`h-full rounded-full ${isc.bg}`} style={{width:`${item.score*10}%`,opacity:.7}}/></div><span className={`text-xs font-bold w-6 text-right ${isc.text}`}>{item.score}</span></div><p className="text-xs text-gray-500">{CANSLIM_LABELS[k]}: {item.reason}</p></div></div>;})}</div></div>}{!loading&&!error&&!data&&<div className="text-center py-8"><p className="text-sm text-gray-500 mb-1">CANSLIM 방법론으로 이 종목을 평가합니다</p><p className="text-xs text-gray-600">7개 항목을 각각 10점 만점으로 분석합니다</p></div>}</div>);}
    function TrendsSection({ticker,name,onNeedApiKey}){const[data,setData]=useState(null);const[loading,setLoading]=useState(false);const[error,setError]=useState(null);const[at,setAt]=useState(null);const run=useCallback(async()=>{const ak=getApiKey();if(!ak){onNeedApiKey();return;}setLoading(true);setError(null);try{setData(await fetchTrends(ak,ticker,name));setAt(new Date().toLocaleString('ko-KR'));}catch(e){setError(e.message);}finally{setLoading(false);}},[ticker,name,onNeedApiKey]);useEffect(()=>{try{const c=sessionStorage.getItem(`trends_${ticker}`);if(c){const p=JSON.parse(c);if(Date.now()-p._cachedAt<TRENDS_CACHE_TTL){setData(p.data);setAt(new Date(p._cachedAt).toLocaleString('ko-KR'));}}}catch{}},[ticker]);
    return(<div className="bg-card border border-border rounded-xl p-5"><div className="flex items-center justify-between mb-4"><h3 className="text-sm font-semibold text-white flex items-center gap-2"><TrendIcon/> 최신 동향 분석</h3><button onClick={run} disabled={loading} className="flex items-center gap-1.5 px-3 py-1.5 text-xs bg-blue-600/20 hover:bg-blue-600/30 border border-blue-500/30 text-blue-400 rounded-lg transition-colors disabled:opacity-50">{loading?<Spinner size={12}/>:<TrendIcon/>}{loading?'분석 중...':data?'재분석':'분석 시작'}</button></div>{loading&&!data&&<div className="flex flex-col items-center justify-center py-12 gap-3"><div className="pulse-glow text-blue-400 flex items-center gap-2"><Spinner size={20}/><span className="text-sm">AI 분석 중...</span></div></div>}{error&&<div className="flex flex-col items-center justify-center py-8 gap-3"><p className="text-sm text-red-400">{error}</p><button onClick={run} className="flex items-center gap-1.5 px-3 py-1.5 text-xs bg-gray-700 hover:bg-gray-600 rounded-lg text-gray-300 transition-colors"><RefreshIcon/> 다시 시도</button></div>}{data&&<div><div className="prose-sm">{renderMarkdown(data)}</div>{at&&<div className="mt-4 pt-3 border-t border-border"><p className="text-xs text-gray-600">분석 시각: {at}</p></div>}</div>}{!loading&&!error&&!data&&<div className="text-center py-8"><p className="text-sm text-gray-500 mb-1">AI가 최신 동향을 분석합니다</p></div>}</div>);}

    /* ═══ Detail Panel ═══ */
    /* OHLC 포인트 배열 → 마커(▲매수 + 📰기사) 생성. 해당 거래일에 매핑하고 시간 오름차순 정렬. */
    function buildChartMarkers(pts,holding,news,upColor,auxColor){
      if(!pts||!pts.length)return[];
      const firstT=pts[0].time,lastT=pts[pts.length-1].time;
      const dayIdx=(date)=>{if(date<firstT)return 0;let i=pts.findIndex(p=>p.time>=date);return i<0?pts.length-1:i;};
      const markers=[];
      const buyDate=holding.addedAt?String(holding.addedAt).slice(0,10):null;
      if(buyDate&&buyDate>=firstT){const i=dayIdx(buyDate);markers.push({time:pts[i].time,position:'belowBar',color:upColor,shape:'arrowUp',text:'매수'});}
      (news||[]).forEach(n=>{if(n&&n.date&&n.date>=firstT&&n.date<=lastT){const i=dayIdx(n.date);markers.push({time:pts[i].time,position:'aboveBar',color:auxColor,shape:'circle',text:'📰'});}});
      markers.sort((a,b)=>a.time<b.time?-1:a.time>b.time?1:0);
      return markers;
    }

    /* ═══ Advanced Chart (lightweight-charts: 캔들 + MA20/60/120 + 거래량 + RSI14 + 매수마커) ═══ */
    function AdvancedChart({chartData,holding,news,big}){
      const wrapRef=useRef(null),priceRef=useRef(null),volRef=useRef(null),rsiRef=useRef(null);
      useEffect(()=>{
        const LC=window.LightweightCharts;
        if(!LC||!priceRef.current)return;
        // OHLC 정렬 (null 제거)
        const T=chartData.times||[],O=chartData.opens||[],H=chartData.highs||[],L=chartData.lows||[],C=chartData.closes||[],V=chartData.volumes||[];
        const pts=[];let lastT=null;for(let i=0;i<T.length;i++){if(O[i]==null||H[i]==null||L[i]==null||C[i]==null)continue;if(lastT!=null&&T[i]<=lastT)continue;lastT=T[i];pts.push({time:T[i],open:O[i],high:H[i],low:L[i],close:C[i],volume:V[i]||0});}
        if(!pts.length)return;
        const closes=pts.map(p=>p.close);
        const sma=(arr,p)=>arr.map((_,i)=>{if(i<p-1)return null;let s=0;for(let j=i-p+1;j<=i;j++)s+=arr[j];return s/p;});
        const rsiCalc=(arr,p=14)=>{const out=new Array(arr.length).fill(null);if(arr.length<=p)return out;let g=0,d=0;for(let i=1;i<=p;i++){const ch=arr[i]-arr[i-1];g+=Math.max(ch,0);d+=Math.max(-ch,0);}g/=p;d/=p;out[p]=100-100/(1+(d===0?100:g/d));for(let i=p+1;i<arr.length;i++){const ch=arr[i]-arr[i-1];g=(g*(p-1)+Math.max(ch,0))/p;d=(d*(p-1)+Math.max(-ch,0))/p;const rs=d===0?100:g/d;out[i]=100-100/(1+rs);}return out;};
        const toLine=vals=>{const o=[];for(let i=0;i<vals.length;i++)if(vals[i]!=null)o.push({time:pts[i].time,value:vals[i]});return o;};
        const ma20=sma(closes,20),ma60=sma(closes,60),ma120=sma(closes,120),rsi=rsiCalc(closes,14);

        const COL={bg:'#0b1220',up:'#34d6ff',down:'#ef5350',aux:'#ffb347',ma60:'#5ad1cd',ma120:'#c39bd3',grid:'rgba(255,255,255,.05)',brd:'rgba(255,255,255,.12)',text:'#8b9dc3'};
        const base={layout:{background:{color:COL.bg},textColor:COL.text,fontSize:11},grid:{vertLines:{color:COL.grid},horzLines:{color:COL.grid}},timeScale:{borderColor:COL.brd,rightOffset:4},rightPriceScale:{borderColor:COL.brd,minimumWidth:64},crosshair:{mode:LC.CrosshairMode?LC.CrosshairMode.Normal:0},handleScale:true,handleScroll:true};
        const w=()=>wrapRef.current?wrapRef.current.clientWidth:600;

        const HP=big?540:300,HS=big?150:110;
        const priceChart=LC.createChart(priceRef.current,{...base,width:w(),height:HP});
        const candle=priceChart.addCandlestickSeries({upColor:COL.up,downColor:COL.down,borderUpColor:COL.up,borderDownColor:COL.down,wickUpColor:COL.up,wickDownColor:COL.down,priceLineVisible:false});
        candle.setData(pts.map(p=>({time:p.time,open:p.open,high:p.high,low:p.low,close:p.close})));
        const mkLine=col=>priceChart.addLineSeries({color:col,lineWidth:1.5,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
        mkLine(COL.aux).setData(toLine(ma20));
        mkLine(COL.ma60).setData(toLine(ma60));
        mkLine(COL.ma120).setData(toLine(ma120));
        // 평균매입가 라인
        if(holding.avgCost>0)candle.createPriceLine({price:holding.avgCost,color:COL.aux,lineWidth:1,lineStyle:2,axisLabelVisible:true,title:'평균매입'});
        // 매수 시점 마커 (포트폴리오 추가일 기준)
        const markers=buildChartMarkers(pts,holding,news,COL.up,COL.aux);
        if(markers.length)candle.setMarkers(markers);

        const volChart=LC.createChart(volRef.current,{...base,width:w(),height:HS});
        volChart.addHistogramSeries({priceFormat:{type:'volume'}}).setData(pts.map(p=>({time:p.time,value:p.volume,color:p.close>=p.open?'rgba(52,214,255,.45)':'rgba(239,83,80,.45)'})));

        const rsiChart=LC.createChart(rsiRef.current,{...base,width:w(),height:HS});
        const rsiS=rsiChart.addLineSeries({color:COL.up,lineWidth:1.5,priceLineVisible:false,lastValueVisible:true,autoscaleInfoProvider:()=>({priceRange:{minValue:0,maxValue:100}})});
        rsiS.setData(toLine(rsi));
        rsiS.createPriceLine({price:70,color:COL.aux,lineWidth:1,lineStyle:2,axisLabelVisible:true,title:'70'});
        rsiS.createPriceLine({price:30,color:COL.aux,lineWidth:1,lineStyle:2,axisLabelVisible:true,title:'30'});

        // 3개 차트 타임스케일 동기화
        const charts=[priceChart,volChart,rsiChart];
        let lock=false;
        const subs=charts.map(ch=>{const fn=()=>{if(lock)return;const r=ch.timeScale().getVisibleLogicalRange();if(!r)return;lock=true;charts.forEach(o=>{if(o!==ch)o.timeScale().setVisibleLogicalRange(r);});lock=false;};ch.timeScale().subscribeVisibleLogicalRangeChange(fn);return[ch,fn];});
        priceChart.timeScale().fitContent();

        let ro;if(window.ResizeObserver&&wrapRef.current){ro=new ResizeObserver(()=>{const nw=w();charts.forEach(ch=>ch.applyOptions({width:nw}));});ro.observe(wrapRef.current);}
        return()=>{if(ro)ro.disconnect();subs.forEach(([ch,fn])=>{try{ch.timeScale().unsubscribeVisibleLogicalRangeChange(fn);}catch{}});charts.forEach(ch=>{try{ch.remove();}catch{}});};
      },[chartData,holding.avgCost,holding.addedAt,news]);

      if(!window.LightweightCharts)return(<div className="flex items-center justify-center h-[300px] text-sm text-gray-500">차트 라이브러리를 불러오지 못했습니다 (네트워크 확인)</div>);
      return(<div ref={wrapRef}>
        <div className="flex items-center gap-3 mb-2 flex-wrap text-[11px] text-gray-400">
          <span className="flex items-center gap-1"><i className="inline-block w-3.5 h-0.5 rounded" style={{background:'#ffb347'}}/>MA20</span>
          <span className="flex items-center gap-1"><i className="inline-block w-3.5 h-0.5 rounded" style={{background:'#5ad1cd'}}/>MA60</span>
          <span className="flex items-center gap-1"><i className="inline-block w-3.5 h-0.5 rounded" style={{background:'#c39bd3'}}/>MA120</span>
          <span className="text-gray-600">· 주황 점선=평균매입 · ▲매수</span>
        </div>
        <div ref={priceRef}/>
        <p className="text-[11px] text-gray-500 mt-3 mb-1">거래량</p>
        <div ref={volRef}/>
        <p className="text-[11px] text-gray-500 mt-3 mb-1">RSI (14)</p>
        <div ref={rsiRef}/>
      </div>);
    }

    /* ═══ 기사 타임라인 미니 차트 — TradingView 위젯은 커스텀 마커를 지원하지 않으므로,
       미장(TradingView)에서도 기사·매수 시점을 표기하기 위해 동일 데이터로 만든 컴팩트 캔들 + 마커 스트립. ═══ */
    function MarkerStrip({chartData,holding,news}){
      const wrapRef=useRef(null),cRef=useRef(null);
      useEffect(()=>{
        const LC=window.LightweightCharts;
        if(!LC||!cRef.current||!chartData)return;
        const T=chartData.times||[],O=chartData.opens||[],H=chartData.highs||[],L=chartData.lows||[],C=chartData.closes||[];
        const pts=[];let lastT=null;for(let i=0;i<T.length;i++){if(O[i]==null||H[i]==null||L[i]==null||C[i]==null)continue;if(lastT!=null&&T[i]<=lastT)continue;lastT=T[i];pts.push({time:T[i],open:O[i],high:H[i],low:L[i],close:C[i]});}
        if(!pts.length)return;
        const COL={bg:'#0b1220',up:'#34d6ff',down:'#ef5350',aux:'#ffb347',grid:'rgba(255,255,255,.05)',brd:'rgba(255,255,255,.12)',text:'#8b9dc3'};
        const w=()=>wrapRef.current?wrapRef.current.clientWidth:600;
        const chart=LC.createChart(cRef.current,{layout:{background:{color:COL.bg},textColor:COL.text,fontSize:11},grid:{vertLines:{color:COL.grid},horzLines:{color:COL.grid}},timeScale:{borderColor:COL.brd,rightOffset:4},rightPriceScale:{borderColor:COL.brd,minimumWidth:64},crosshair:{mode:LC.CrosshairMode?LC.CrosshairMode.Normal:0},width:w(),height:170});
        const candle=chart.addCandlestickSeries({upColor:COL.up,downColor:COL.down,borderUpColor:COL.up,borderDownColor:COL.down,wickUpColor:COL.up,wickDownColor:COL.down,priceLineVisible:false});
        candle.setData(pts);
        if(holding.avgCost>0)candle.createPriceLine({price:holding.avgCost,color:COL.aux,lineWidth:1,lineStyle:2,axisLabelVisible:true,title:'평균매입'});
        const markers=buildChartMarkers(pts,holding,news,COL.up,COL.aux);
        if(markers.length)candle.setMarkers(markers);
        chart.timeScale().fitContent();
        let ro;if(window.ResizeObserver&&wrapRef.current){ro=new ResizeObserver(()=>chart.applyOptions({width:w()}));ro.observe(wrapRef.current);}
        return()=>{if(ro)ro.disconnect();try{chart.remove();}catch{}};
      },[chartData,holding.avgCost,holding.addedAt,news]);
      if(!window.LightweightCharts||!chartData)return null;
      return(<div ref={wrapRef} className="mt-4 pt-4 border-t border-border">
        <p className="text-[11px] text-gray-400 mb-2 flex items-center gap-2 flex-wrap"><span className="text-white font-medium">기사 타임라인</span><span className="text-gray-600">·</span><span className="flex items-center gap-1"><span style={{color:'#ffb347'}}>●</span>기사 시점</span><span className="flex items-center gap-1"><span style={{color:'#34d6ff'}}>▲</span>매수</span><span className="text-gray-600">(TradingView 위젯엔 마커 표시가 불가해 별도 표기)</span></p>
        <div ref={cRef}/>
      </div>);
    }

    /* ═══ TradingView Advanced Chart (위젯 임베드 · 별도 기능) ═══ */
    /* 포트폴리오 티커 → TradingView 심볼 매핑. 한국 종목(.KS/.KQ, 6자리)은 KRX:코드, 그 외는 그대로(TradingView 자동 해석). */
    function toTVSymbol(ticker){
      if(!ticker)return '';
      const t=ticker.trim().toUpperCase();
      const m=t.match(/^(\d{6})\.(KS|KQ)$/);
      if(m)return `KRX:${m[1]}`;
      if(/^\d{6}$/.test(t))return `KRX:${t}`;
      return t;
    }
    /* 국장(한국) 종목 판별: .KS/.KQ 접미사 또는 6자리 숫자 코드. 국장=기본차트, 미장=TradingView 기본값에 사용. */
    function isKoreanTicker(ticker){
      if(!ticker)return false;
      const t=String(ticker).trim().toUpperCase();
      return /\.(KS|KQ)$/.test(t)||/^\d{6}$/.test(t);
    }
    /* 미장 등 TradingView 차트를 코드별로 새 창(팝업)에서 연다 — 심볼을 URL로 직접 전달하므로 코드 전달 누락 문제가 없다. */
    function openTradingViewPopup(ticker){
      const sym=toTVSymbol(ticker);
      const url=`https://www.tradingview.com/chart/?symbol=${encodeURIComponent(sym)}`;
      const name=('tv_'+sym).replace(/[^A-Za-z0-9_]/g,'_');
      window.open(url,name,'width=1320,height=880,resizable=yes,scrollbars=yes');
    }
    let _tvSeq=0;
    function TradingViewChart({ticker,big}){
      const ref=useRef(null);
      const idRef=useRef('tv_'+(_tvSeq++)+'_'+ticker.replace(/[^A-Za-z0-9]/g,''));
      useEffect(()=>{
        if(!window.TradingView||!ref.current)return;
        ref.current.innerHTML='';
        const inner=document.createElement('div');
        inner.id=idRef.current; inner.style.height=big?'78vh':'560px'; inner.style.width='100%';
        ref.current.appendChild(inner);
        try{
          new window.TradingView.widget({
            container_id: idRef.current,
            autosize: true,
            symbol: toTVSymbol(ticker),
            interval: 'D',                 // 일봉
            timezone: 'Asia/Seoul',
            theme: 'dark',                 // 다크테마
            style: '1',                    // 캔들
            locale: 'kr',
            toolbar_bg: '#0b1220',
            enable_publishing: false,
            allow_symbol_change: true,
            hide_side_toolbar: false,
            withdateranges: true,
            studies: [                     // 20/60/120 이동평균선 + RSI(14)
              { id:'MASimple@tv-basicstudies', inputs:{ length:20 } },
              { id:'MASimple@tv-basicstudies', inputs:{ length:60 } },
              { id:'MASimple@tv-basicstudies', inputs:{ length:120 } },
              { id:'RSI@tv-basicstudies',      inputs:{ length:14 } },
            ],
          });
        }catch(e){ console.warn('[Woodsman] TradingView 위젯 생성 실패 → '+e.message); }
        return ()=>{ try{ if(ref.current)ref.current.innerHTML=''; }catch{} };
      },[ticker,big]);
      if(!window.TradingView)return(<div className="flex flex-col items-center justify-center h-[300px] gap-3 text-sm text-gray-500 text-center px-4"><p>TradingView 위젯을 불러오지 못했습니다 (네트워크 확인)</p><button onClick={()=>openTradingViewPopup(ticker)} className="px-3 py-1.5 text-xs bg-emerald hover:bg-emeraldDark text-white rounded-lg transition-colors">↗ TradingView 새 창에서 열기</button></div>);
      return(<div>
        <div ref={ref} style={{height:big?'78vh':'560px',width:'100%'}}/>
        <div className="flex items-center justify-between mt-2 gap-2 flex-wrap"><p className="text-[11px] text-gray-600">심볼: <span className="font-mono text-gray-400">{toTVSymbol(ticker)}</span> · 일봉 · MA 20/60/120 · RSI(14)</p><button onClick={()=>openTradingViewPopup(ticker)} className="px-2.5 py-1 text-[11px] border border-border text-gray-300 hover:text-white hover:bg-[#12141c] rounded-md transition-colors">↗ 새 창에서 열기</button></div>
      </div>);
    }

    /* ═══ 주요 기사(뉴스) 리스트 — 차트 하단 표시 ═══ */
    function NewsList({news,loading}){
      if(loading)return(<div className="mt-5 pt-4 border-t border-border flex items-center gap-2 text-xs text-gray-500"><Spinner size={12}/> 주요 기사 불러오는 중...</div>);
      if(!news||!news.length)return(<div className="mt-5 pt-4 border-t border-border"><p className="text-xs text-gray-500">표시할 주요 기사가 없습니다.</p></div>);
      return(<div className="mt-5 pt-4 border-t border-border">
        <h4 className="text-xs font-semibold text-white mb-3 flex items-center gap-1.5">📰 주요 기사 <span className="text-gray-600 font-normal">({news.length})</span></h4>
        <ul className="space-y-2">{news.slice(0,8).map((n,i)=>(
          <li key={i} className="flex items-start gap-2.5 text-xs">
            <span className="text-gray-600 font-mono shrink-0 w-[72px] pt-0.5">{n.date}</span>
            <a href={n.link} target="_blank" rel="noopener noreferrer" className="text-gray-300 hover:text-emerald transition-colors leading-relaxed flex-1">{n.title}</a>
            {n.publisher&&<span className="text-gray-600 shrink-0 hidden sm:inline pt-0.5">{n.publisher}</span>}
          </li>))}</ul>
        <p className="text-[10px] text-gray-600 mt-3">차트의 <span style={{color:'#ffb347'}}>●</span> 마커는 기사 게재 시점입니다 · 출처: Yahoo Finance</p>
      </div>);
    }

    /* ═══ 캔들 패턴 분석 (망치형/유성형/도지형) ─ OHLCV로 직접 탐지 ═══ */
    /* 최근 N봉을 훑어 반전형 단일 캔들 패턴을 찾는다. 거래량은 직전 20봉 평균 대비 비율로 평가. */
    function analyzeCandlePatterns(chartData,lookback=15){
      const T=chartData?.times||[],O=chartData?.opens||[],H=chartData?.highs||[],L=chartData?.lows||[],C=chartData?.closes||[],V=chartData?.volumes||[];
      const pts=[];for(let i=0;i<T.length;i++){if(O[i]==null||H[i]==null||L[i]==null||C[i]==null)continue;pts.push({t:T[i],o:O[i],h:H[i],l:L[i],c:C[i],v:V[i]||0});}
      const n=pts.length;if(n<6)return[];
      const pad=ts=>{const d=new Date(ts*1000);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
      const out=[];const start=Math.max(1,n-lookback);
      for(let i=start;i<n;i++){
        const p=pts[i];const body=Math.abs(p.c-p.o);const range=p.h-p.l;if(range<=0)continue;
        const upper=p.h-Math.max(p.o,p.c),lower=Math.min(p.o,p.c)-p.l;
        const win=pts.slice(Math.max(0,i-20),i);const avgVol=win.length?win.reduce((s,x)=>s+x.v,0)/win.length:p.v;
        const volRatio=avgVol>0?p.v/avgVol:1;const bodyRatio=body/range;
        const lowerMult=body>0?lower/body:99,upperMult=body>0?upper/body:99;
        let type=null;
        if(bodyRatio<=0.1)type='doji';                                            // 도지형: 몸통이 전체 범위의 10% 이하
        else if(lower>=2*body&&upper<=body*0.7&&bodyRatio<=0.4)type='hammer';     // 망치형: 아래꼬리≥몸통2배, 위꼬리 짧음
        else if(upper>=2*body&&lower<=body*0.7&&bodyRatio<=0.4)type='shooting';   // 유성형: 위꼬리≥몸통2배, 아래꼬리 짧음
        if(type)out.push({type,date:pad(p.t),price:p.c,volRatio,bodyRatio,lowerMult,upperMult});
      }
      return out.reverse(); // 최신 우선
    }
    const PATTERN_META={
      hammer:{label:'망치형',en:'Hammer',icon:'🔨',tone:{text:'text-emerald',bd:'border-emerald/40',bg:'bg-emerald/10'}},
      shooting:{label:'유성형',en:'Shooting Star',icon:'☄️',tone:{text:'text-red-400',bd:'border-red-500/40',bg:'bg-red-500/10'}},
      doji:{label:'도지형',en:'Doji',icon:'✚',tone:{text:'text-amber-400',bd:'border-amber-500/40',bg:'bg-amber-500/10'}},
    };
    function patternDetail(p){
      const vr=p.volRatio,volOn=vr>=1.5;
      const volTxt=volOn?`거래량이 평소(20일 평균)의 ${vr.toFixed(1)}배로 동반 증가`:`거래량은 평소의 ${vr.toFixed(1)}배 수준`;
      if(p.type==='hammer')return{
        reason:`아래꼬리가 몸통의 ${p.lowerMult.toFixed(1)}배로 길어, 저가권에서 매수세가 강하게 유입된 형태입니다. ${volTxt}입니다.`,
        rec:'매수 관점 강화 · 비중 확대',
        sub:(p.lowerMult>=2&&p.lowerMult<=3)?'꼬리 길이 2~3배 조건 충족':p.lowerMult>3?'꼬리 3배 초과 — 강한 하방 거부':'꼬리 길이 조건 충족',
      };
      if(p.type==='shooting')return{
        reason:`위꼬리가 몸통의 ${p.upperMult.toFixed(1)}배로 길어, 고가권에서 매도 압력이 출회된 형태입니다. ${volTxt}입니다.`,
        rec:volOn?'트레이딩 물량 축소 · 리스크 관리':'경계 · 추세 둔화 주시',
        sub:volOn?'거래량 동반 — 신뢰도 높음':'거래량 미동반 — 신호 약함',
      };
      return{ // doji
        reason:`시가와 종가가 거의 같아(몸통이 전체 범위의 ${(p.bodyRatio*100).toFixed(0)}%) 매수·매도가 팽팽한 균형 상태로, 기존 추세의 균형 붕괴 전조입니다. ${volTxt}입니다.`,
        rec:volOn?'강력한 추세 전환 신호 — 방향 확정 시 적극 대응':'방향성 모호 — 돌파 방향 확인 후 대응',
        sub:volOn?'거래량 큼 — 전환 신호 강력':'거래량 작음 — 신호 약함',
      };
    }
    function CandlePatternSection({chartData,news}){
      const patterns=useMemo(()=>chartData?analyzeCandlePatterns(chartData):[],[chartData]);
      if(!chartData)return null;
      const latest=patterns[0];
      const summary=!latest?'최근 캔들에서 망치형·유성형·도지형 등 뚜렷한 반전 패턴이 감지되지 않았습니다. 추세 지속 관점에서 관망이 유효합니다.'
        :latest.type==='hammer'?'최근 망치형이 출현해 단기 저점 매수 신호가 우세합니다. 비중 확대 관점으로 접근할 수 있습니다.'
        :latest.type==='shooting'?'최근 유성형이 출현해 단기 고점 경계가 필요합니다. 트레이딩 물량 축소와 리스크 관리를 권장합니다.'
        :'최근 도지형이 출현해 추세 균형이 무너지는 전조일 수 있습니다. 거래량을 동반한 방향 확정에 유의하세요.';
      return(<div className="mt-5 pt-4 border-t border-border">
        <h4 className="text-xs font-semibold text-white mb-3 flex items-center gap-1.5">🕯️ 캔들 패턴 분석 <span className="text-gray-600 font-normal">(최근 15봉)</span></h4>
        {patterns.length===0?<p className="text-xs text-gray-500">감지된 반전 패턴이 없습니다.</p>:
        <ul className="space-y-3">{patterns.map((p,i)=>{const m=PATTERN_META[p.type];const d=patternDetail(p);return(
          <li key={i} className={`rounded-lg border ${m.tone.bd} ${m.tone.bg} p-3`}>
            <div className="flex items-center gap-2 mb-1.5 flex-wrap">
              <span className="text-base leading-none">{m.icon}</span>
              <span className={`text-sm font-bold ${m.tone.text}`}>{m.label}</span>
              <span className="text-[10px] text-gray-500">{m.en}</span>
              <span className="text-[10px] text-gray-500 font-mono ml-auto">{p.date}</span>
            </div>
            <p className="text-xs text-gray-300 leading-relaxed mb-2"><span className="text-gray-500">분석 사유 · </span>{d.reason}</p>
            <div className="flex items-center gap-2 flex-wrap">
              <span className={`text-[11px] font-semibold px-2 py-1 rounded ${m.tone.text} ${m.tone.bg} border ${m.tone.bd}`}>▶ {d.rec}</span>
              <span className="text-[10px] text-gray-500">{d.sub}</span>
            </div>
            {p.type==='shooting'&&<div className="mt-2.5 pt-2.5 border-t border-red-500/20">
              <p className="text-[11px] text-red-300/90 mb-1.5">📰 고점 경계 신호 — 뉴스·시장 분위기를 함께 확인하세요</p>
              {news&&news.length?<ul className="space-y-1.5">{news.slice(0,5).map((nw,j)=>(
                <li key={j} className="flex items-start gap-2 text-[11px]"><span className="text-gray-600 font-mono shrink-0 w-[64px] pt-0.5">{nw.date}</span><a href={nw.link} target="_blank" rel="noopener noreferrer" className="text-gray-300 hover:text-emerald transition-colors leading-relaxed flex-1">{nw.title}</a></li>
              ))}</ul>:<p className="text-[11px] text-gray-500">표시할 관련 기사가 없습니다.</p>}
            </div>}
          </li>);})}</ul>}
        <div className="mt-3 bg-[#12141c] border border-border rounded-lg p-3">
          <p className="text-xs font-semibold text-white mb-1 flex items-center gap-1.5">🧭 종합 의견</p>
          <p className="text-xs text-gray-400 leading-relaxed">{summary}</p>
        </div>
        <p className="text-[10px] text-gray-600 mt-2">※ 캔들 패턴은 보조 지표입니다. 거래량·추세·뉴스와 함께 종합 판단하세요.</p>
      </div>);
    }

    /* ═══ 차트 확대 팝업 (모달) — 국장: 기본차트 / 미장: TradingView를 크게 표시 ═══ */
    function ChartPopup({holding,chartData,news,mode,onClose}){
      useEffect(()=>{const h=e=>{if(e.key==='Escape')onClose();};window.addEventListener('keydown',h);return()=>window.removeEventListener('keydown',h);},[onClose]);
      return(<div className="fixed inset-0 z-[70] flex items-center justify-center modal-backdrop bg-black/70 p-3 md:p-6" onClick={onClose}>
        <div className="bg-bg border border-border rounded-2xl w-full max-w-6xl h-[94vh] overflow-y-auto shadow-2xl" onClick={e=>e.stopPropagation()}>
          <div className="sticky top-0 z-10 bg-bg/90 backdrop-blur-md border-b border-border px-5 py-3 flex items-center justify-between gap-3">
            <div className="flex items-center gap-2 min-w-0"><h3 className="text-base font-bold text-white truncate">{holding.name}</h3><span className="text-xs text-gray-500 font-mono">{holding.ticker}</span><span className="text-[10px] px-1.5 py-0.5 rounded bg-gray-800 text-gray-400">{mode==='tv'?'TradingView':'기본차트'}</span></div>
            <div className="flex items-center gap-2">{mode==='tv'&&<button onClick={()=>openTradingViewPopup(holding.ticker)} className="px-2.5 py-1.5 text-xs border border-border text-gray-300 hover:text-white hover:bg-card rounded-md transition-colors">↗ 새 창</button>}<button onClick={onClose} className="p-1.5 rounded-lg hover:bg-gray-800 text-gray-400 hover:text-white transition-colors"><svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
          </div>
          <div className="p-5">
            {mode==='tv'?<><TradingViewChart ticker={holding.ticker} big/>{chartData&&<MarkerStrip chartData={chartData} holding={holding} news={news}/>}</>:(chartData?<AdvancedChart chartData={chartData} holding={holding} news={news} big/>:<div className="flex items-center justify-center h-[400px] text-sm text-gray-500">차트 데이터를 불러오는 중이거나 없습니다.</div>)}
            <CandlePatternSection chartData={chartData} news={news}/>
            <NewsList news={news}/>
          </div>
        </div>

    function UserManagementModal({open,onClose,currentUser,addToast}){
      const[users,setUsers]=useState([]);
      const[form,setForm]=useState({username:'',password:'',role:'user'});
      const[error,setError]=useState('');
      const[busy,setBusy]=useState(false);
      const refresh=()=>setUsers(loadUsers());
      useEffect(()=>{if(open){refresh();setForm({username:'',password:'',role:'user'});setError('');}},[open]);
      if(!open)return null;
      const addUser=async(e)=>{e.preventDefault();if(busy)return;setError('');
        const uname=form.username.trim();
        if(uname.length<3){setError('아이디는 3자 이상이어야 합니다.');return;}
        if(form.password.length<4){setError('비밀번호는 4자 이상이어야 합니다.');return;}
        const existing=loadUsers();
        if(existing.some(u=>u.username.toLowerCase()===uname.toLowerCase())){setError('이미 존재하는 아이디입니다.');return;}
        setBusy(true);
        const salt=genId();const pwHash=await hashPassword(form.password,salt);
        saveUsers([...existing,{id:genId(),username:uname,salt,pwHash,role:form.role,createdAt:new Date().toISOString()}]);
        refresh();setForm({username:'',password:'',role:'user'});setBusy(false);
        addToast&&addToast(`${uname} 사용자가 등록되었습니다`);
      };
      const removeUser=(u)=>{setError('');
        if(u.id===currentUser.userId){setError('현재 로그인한 계정은 삭제할 수 없습니다.');return;}
        const all=loadUsers();
        if(u.role==='admin'&&all.filter(x=>x.role==='admin').length<=1){setError('마지막 관리자 계정은 삭제할 수 없습니다.');return;}
        saveUsers(all.filter(x=>x.id!==u.id));deletePortfolio(u.id);refresh();addToast&&addToast(`${u.username} 사용자가 삭제되었습니다`);
      };
      const resetPw=async(u)=>{setError('');
        const np=window.prompt(`${u.username}의 새 비밀번호를 입력하세요 (4자 이상)`,'');
        if(np===null)return;
        if(np.length<4){setError('비밀번호는 4자 이상이어야 합니다.');return;}
        const salt=genId();const pwHash=await hashPassword(np,salt);
        saveUsers(loadUsers().map(x=>x.id===u.id?{...x,salt,pwHash}:x));refresh();addToast&&addToast(`${u.username}의 비밀번호가 변경되었습니다`);
      };
      const inputCls="w-full bg-[#12141c] border border-border rounded-lg px-3 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-emerald focus:ring-1 focus:ring-emerald/30 transition-colors";
      return(<div className="fixed inset-0 z-[60] flex items-center justify-center modal-backdrop bg-black/60" onClick={onClose}><div className="bg-card border border-border rounded-2xl w-full max-w-lg mx-4 shadow-2xl max-h-[90vh] flex flex-col" onClick={e=>e.stopPropagation()}>

          <form onSubmit={addUser} className="bg-[#12141c] border border-border rounded-xl p-4 space-y-3">

            <div className="grid grid-cols-2 gap-3">
              <div><label className="block text-xs text-gray-400 mb-1.5">아이디</label><input value={form.username} onChange={e=>setForm({...form,username:e.target.value})} className={inputCls} placeholder="3자 이상"/></div>
              <div><label className="block text-xs text-gray-400 mb-1.5">비밀번호</label><input type="password" value={form.password} onChange={e=>setForm({...form,password:e.target.value})} className={inputCls} placeholder="4자 이상"/></div>
            </div>
            <div className="flex items-end gap-3">
              <div className="flex-1"><label className="block text-xs text-gray-400 mb-1.5">권한</label><select value={form.role} onChange={e=>setForm({...form,role:e.target.value})} className={inputCls+" pr-8"}><option value="user">사용자</option><option value="admin">관리자</option></select></div>
              <button type="submit" disabled={busy} className="px-4 py-2.5 bg-emerald hover:bg-emeraldDark text-white text-sm font-medium rounded-lg transition-colors disabled:opacity-50 whitespace-nowrap">{busy?'등록 중...':'+ 등록'}</button>
            </div>
            {error&&<p className="text-xs text-red-400">{error}</p>}
          </form>
          <div className="space-y-2">
            <p className="text-xs font-semibold text-gray-400">등록된 사용자 ({users.length})</p>
            {users.map(u=>(<div key={u.id} className="flex items-center justify-between bg-[#12141c] border border-border rounded-lg px-4 py-3">
              <div className="flex items-center gap-3 min-w-0">
                <div className="w-8 h-8 rounded-full bg-gray-700 flex items-center justify-center text-xs font-semibold text-gray-300 shrink-0">{u.username.slice(0,2).toUpperCase()}</div>
                <div className="min-w-0"><p className="text-sm text-white font-medium truncate">{u.username}{u.id===currentUser.userId&&<span className="text-[10px] text-gray-500 ml-1.5">(나)</span>}</p><span className={"text-[10px] px-1.5 py-0.5 rounded "+(u.role==='admin'?'bg-gold/15 text-gold':'bg-gray-700 text-gray-400')}>{u.role==='admin'?'관리자':'사용자'}</span></div>
              </div>
              <div className="flex items-center gap-1 shrink-0">
                <button onClick={()=>resetPw(u)} className="p-2 rounded-lg text-gray-400 hover:text-white hover:bg-gray-700 transition-colors" title="비밀번호 변경"><KeyIconSm/></button>
                <button onClick={()=>removeUser(u)} className="p-2 rounded-lg text-gray-400 hover:text-red-400 hover:bg-red-500/10 transition-colors" title="삭제"><TrashIconSm/></button>
              </div>
            </div>))}
          </div>
        </div>
        <div className="flex justify-end px-6 py-4 border-t border-border"><button onClick={onClose} className="px-4 py-2 text-sm rounded-lg bg-gray-700 hover:bg-gray-600 text-gray-300 transition-colors">닫기</button></div>
      </div></div>);
    }

    function App({session,onLogout}){
      const[holdings,setHoldings]=useState(()=>loadPortfolio(session.userId));
      const[modalOpen,setModalOpen]=useState(false);
      const[editTarget,setEditTarget]=useState(null);
      const[deleteTarget,setDeleteTarget]=useState(null);
      const[detailTarget,setDetailTarget]=useState(null);
      const[settingsOpen,setSettingsOpen]=useState(false);
      const[shortcutsOpen,setShortcutsOpen]=useState(false);
      const[importOpen,setImportOpen]=useState(false);
      const[usersOpen,setUsersOpen]=useState(false);
      const[prices,setPrices]=useState({});
      const[pricesLoading,setPricesLoading]=useState(false);
      const[search,setSearch]=useState('');
      const[industryFilter,setIndustryFilter]=useState('전체');
      const[weightFilter,setWeightFilter]=useState('전체');
      const[sortBy,setSortBy]=useState('addedAt_desc');
      const[showBackupBanner,setShowBackupBanner]=useState(()=>needsBackupWarning());
      const{toasts,addToast,removeToast}=useToast();

      useEffect(()=>{savePortfolio(session.userId,holdings);},[holdings,session.userId]);

      const fetchAllPrices=useCallback(async()=>{if(!holdings.length)return;setPricesLoading(true);const ls={};holdings.forEach(h=>{ls[h.ticker]={loading:true};});setPrices(ls);const r={};await Promise.allSettled(holdings.map(async h=>{try{const d=await fetchCurrentPrice(h.ticker);r[h.ticker]={price:d.price,exchange:d.exchange,loading:false};}catch(e){r[h.ticker]={error:e.message,loading:false};}}));setPrices(r);setPricesLoading(false);},[holdings]);
      useEffect(()=>{fetchAllPrices();},[fetchAllPrices]);

      const totalPortfolioValue=useMemo(()=>holdings.reduce((s,h)=>s+(prices[h.ticker]?.price??h.avgCost)*h.shares,0),[holdings,prices]);
      const activeIndustries=useMemo(()=>[...new Set(holdings.map(h=>h.industry))],[holdings]);
      const filteredHoldings=useMemo(()=>{let list=[...holdings];if(search.trim()){const q=search.trim().toLowerCase();list=list.filter(h=>h.name.toLowerCase().includes(q)||h.ticker.toLowerCase().includes(q));}if(industryFilter!=='전체')list=list.filter(h=>h.industry===industryFilter);if(weightFilter!=='전체')list=list.filter(h=>h.weight===weightFilter);list.sort((a,b)=>{if(sortBy==='return_desc'){const ra=prices[a.ticker]?.price!=null?((prices[a.ticker].price-a.avgCost)/a.avgCost):-Infinity;const rb=prices[b.ticker]?.price!=null?((prices[b.ticker].price-b.avgCost)/b.avgCost):-Infinity;return rb-ra;}if(sortBy==='value_desc'){return((prices[b.ticker]?.price??b.avgCost)*b.shares)-((prices[a.ticker]?.price??a.avgCost)*a.shares);}if(sortBy==='canslim_desc'){return(getCachedCanslim(b.ticker)?.composite??-1)-(getCachedCanslim(a.ticker)?.composite??-1);}return new Date(b.addedAt)-new Date(a.addedAt);});return list;},[holdings,prices,search,industryFilter,weightFilter,sortBy]);

      // Keyboard shortcuts
      useEffect(()=>{const handler=(e)=>{if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;if(e.key==='n'||e.key==='N'){e.preventDefault();setEditTarget(null);setModalOpen(true);}if(e.key==='?'){e.preventDefault();setShortcutsOpen(true);}};window.addEventListener('keydown',handler);return()=>window.removeEventListener('keydown',handler);},[]);
      // ESC closes modals
      useEffect(()=>{const handler=(e)=>{if(e.key==='Escape'){if(usersOpen)setUsersOpen(false);else if(settingsOpen)setSettingsOpen(false);else if(shortcutsOpen)setShortcutsOpen(false);else if(importOpen)setImportOpen(false);else if(deleteTarget)setDeleteTarget(null);else if(modalOpen){setModalOpen(false);setEditTarget(null);}else if(detailTarget)setDetailTarget(null);}};window.addEventListener('keydown',handler);return()=>window.removeEventListener('keydown',handler);},[usersOpen,settingsOpen,shortcutsOpen,importOpen,deleteTarget,modalOpen,detailTarget]);

      const openAdd=()=>{setEditTarget(null);setModalOpen(true);};
      const openEdit=(h)=>{setEditTarget(h);setModalOpen(true);};
      const closeModal=()=>{setModalOpen(false);setEditTarget(null);};
      const handleSave=(data)=>{const isNew=!holdings.find(h=>h.id===data.id);setHoldings(prev=>{const idx=prev.findIndex(h=>h.id===data.id);if(idx>=0){const next=[...prev];next[idx]=data;return next;}return[...prev,data];});closeModal();addToast(isNew?`${data.name} 종목이 추가되었습니다`:`${data.name} 종목이 수정되었습니다`);};
      const handleDelete=()=>{if(!deleteTarget)return;const name=deleteTarget.name;setHoldings(prev=>prev.filter(h=>h.id!==deleteTarget.id));setDeleteTarget(null);addToast(`${name} 종목이 삭제되었습니다`);};
      const handleExport=()=>{exportPortfolio(holdings);setShowBackupBanner(false);addToast('포트폴리오가 내보내기 되었습니다');};
      const handleImport=(data,mode)=>{if(mode==='replace'){setHoldings(data);addToast(`${data.length}개 종목으로 교체되었습니다`);}else{const existing=new Set(holdings.map(h=>h.id));const newItems=data.filter(d=>!existing.has(d.id));setHoldings(prev=>[...prev,...newItems]);addToast(`${newItems.length}개 종목이 병합되었습니다`);}};

      return(<div className="min-h-screen bg-bg">
        <header className="sticky top-0 z-30 bg-bg/80 backdrop-blur-md border-b border-border"><div className="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between"><div className="flex items-center gap-3"><div className="w-9 h-9 rounded-lg overflow-hidden border border-gold/30 flex items-center justify-center bg-black"><img src={LOGO_DATA_URI} alt="Woodsman" className="w-full h-full object-cover" /></div><h1 className="text-xl font-bold text-gold tracking-tight">Woodsman</h1></div>
          <div className="flex items-center gap-1.5 sm:gap-2">
            {holdings.length>0&&<button onClick={fetchAllPrices} disabled={pricesLoading} className="flex items-center gap-1.5 px-2.5 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 text-sm rounded-lg transition-colors disabled:opacity-50" title="현재가 새로고침">{pricesLoading?<Spinner size={14}/>:<RefreshIcon/>}<span className="hidden sm:inline">새로고침</span></button>}
            {holdings.length>0&&<button onClick={handleExport} className="flex items-center gap-1.5 px-2.5 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 text-sm rounded-lg transition-colors" title="내보내기"><DownloadIcon/><span className="hidden md:inline">내보내기</span></button>}
            <button onClick={()=>setImportOpen(true)} className="flex items-center gap-1.5 px-2.5 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 text-sm rounded-lg transition-colors" title="가져오기"><UploadIcon/><span className="hidden md:inline">가져오기</span></button>
            <button onClick={()=>setSettingsOpen(true)} className="p-2 rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-400 hover:text-white transition-colors" title="설정"><GearIcon/></button>
            <button onClick={openAdd} className="flex items-center gap-1.5 px-3 sm:px-4 py-2 bg-emerald hover:bg-emeraldDark text-white text-sm font-medium rounded-lg transition-colors"><svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span className="hidden sm:inline">종목 추가</span></button>
            <div className="w-px h-6 bg-border mx-0.5 sm:mx-1"></div>
            {session.role==='admin'&&<button onClick={()=>setUsersOpen(true)} className="p-2 rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-400 hover:text-white transition-colors" title="사용자 관리"><UsersIcon/></button>}
            <div className="hidden sm:flex flex-col items-end leading-tight pl-1"><span className="text-xs text-gray-300 font-medium">{session.username}</span><span className="text-[10px] text-gold">{session.role==='admin'?'관리자':'사용자'}</span></div>
            <button onClick={onLogout} className="p-2 rounded-lg bg-gray-800 hover:bg-red-500/20 text-gray-400 hover:text-red-400 transition-colors" title="로그아웃"><LogoutIcon/></button>
          </div></div></header>

        <main className="max-w-7xl mx-auto px-4 sm:px-6 py-8">{holdings.length>0?<>
          {showBackupBanner&&holdings.length>0&&<BackupBanner onExport={handleExport} onDismiss={()=>setShowBackupBanner(false)}/>}
          <SummaryPanel holdings={holdings} prices={prices}/>
          <FilterBar search={search} setSearch={setSearch} industryFilter={industryFilter} setIndustryFilter={setIndustryFilter} weightFilter={weightFilter} setWeightFilter={setWeightFilter} sortBy={sortBy} setSortBy={setSortBy} activeIndustries={activeIndustries}/>
          {filteredHoldings.length>0?<div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-4">{filteredHoldings.map(h=>{const val=(prices[h.ticker]?.price??h.avgCost)*h.shares;const pw=totalPortfolioValue>0?(val/totalPortfolioValue*100):null;const cs=getCachedCanslim(h.ticker)?.composite??null;return<StockCard key={h.id} holding={h} priceInfo={prices[h.ticker]} priceLoading={prices[h.ticker]?.loading} onEdit={openEdit} onDelete={setDeleteTarget} onClick={setDetailTarget} portfolioWeight={pw} canslimScore={cs}/>;})}</div>:<div className="flex flex-col items-center justify-center py-16 text-center"><svg width="48" height="48" fill="none" stroke="#2a2e3a" strokeWidth="1.5" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><p className="text-gray-500 text-sm mt-4">검색 결과가 없습니다</p><p className="text-gray-600 text-xs mt-1">필터 조건을 변경해보세요</p></div>}
        </>:<EmptyState onAdd={openAdd}/>}</main>

        <StockModal open={modalOpen} onClose={closeModal} onSave={handleSave} initial={editTarget} isEdit={!!editTarget}/>
        <ConfirmModal open={!!deleteTarget} onClose={()=>setDeleteTarget(null)} onConfirm={handleDelete} title="종목 삭제" message={`"${deleteTarget?.name||''}" 종목을 정말 삭제하시겠습니까?`}/>
        <SettingsModal open={settingsOpen} onClose={()=>setSettingsOpen(false)}/>
        <ShortcutsModal open={shortcutsOpen} onClose={()=>setShortcutsOpen(false)}/>
        <ImportModal open={importOpen} onClose={()=>setImportOpen(false)} onImport={handleImport}/>
        {session.role==='admin'&&<UserManagementModal open={usersOpen} onClose={()=>setUsersOpen(false)} currentUser={session} addToast={addToast}/>}
        {detailTarget&&<DetailPanel holding={detailTarget} priceInfo={prices[detailTarget.ticker]} onClose={()=>setDetailTarget(null)} onOpenSettings={()=>setSettingsOpen(true)}/>}
        <ToastContainer toasts={toasts} removeToast={removeToast}/>
      </div>);}

    function Root(){
      const[session,setSessionState]=useState(()=>getSession());
      const[ready,setReady]=useState(false);
      useEffect(()=>{ensureSeedAdmin().then(()=>setReady(true));},[]);
      const handleLogin=(s)=>{setSessionStorage(s);setSessionState(s);};
      const handleLogout=()=>{setSessionStorage(null);setSessionState(null);};
      if(!ready)return(<div className="min-h-screen bg-bg flex items-center justify-center"><Spinner size={28}/></div>);
      if(!session)return <LoginScreen onLogin={handleLogin}/>;
      return <App key={session.userId} session={session} onLogout={handleLogout}/>;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
  </script>
</body>
</html>
